version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - order-service-network

  wiremock:
    image: wiremock/wiremock:3.3.1
    container_name: user-service-mock
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "8080:8080"
    networks:
      - order-service-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 3

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8082
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/order_service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://wiremock:8080
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    networks:
      - order-service-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:

networks:
  order-service-network:
    driver: bridge
