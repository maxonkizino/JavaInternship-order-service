spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:tc:postgresql:16-alpine:///order_service_test?user=postgres&password=postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: test
    drop-first: true
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_TEST_SECRET}
          enabled: false

spring.cloud.openfeign.client.config.default.connectTimeout: 1000
spring.cloud.openfeign.client.config.default.readTimeout: 1000

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 500ms
        wait-duration-in-open-state: 1s
        sliding-window-size: 3
        permitted-number-of-calls-in-half-open-state: 1
    instances:
      userService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 1s
        cancel-running-future: true

logging:
  level:
    com.javainternshiporderservice: INFO
    org.springframework.security: WARN
    com.github.tomakehurst.wiremock: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

JWT_TEST_SECRET: test-secret-key-at-least-256-bits-long-for-hs256-xxxxxxxx
USER_SERVICE_URL: http://localhost:8080

app:
  name: order-service
