# Локальная сборка order-service для общего стека (корневой docker-compose.yml).
services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - stack
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8083"
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/order_service
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      APP_KAFKA_GROUP_ID: ${APP_KAFKA_GROUP_ID}
      APP_KAFKA_ENABLED: ${APP_KAFKA_ENABLED}
      APP_KAFKA_TOPIC_CREATE_PAYMENT: ${APP_KAFKA_TOPIC_CREATE_PAYMENT}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

networks:
  stack:
    driver: bridge
